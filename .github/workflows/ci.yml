name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (critical checks)
        run: ruff check app --select E9,F63,F7,F82

      - name: Run tests
        run: pytest app/tests -q

      - name: Build Docker image
        run: docker build -t sharecart-ai-service:ci .
