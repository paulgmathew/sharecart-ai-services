services:
  - type: web
    name: sharecart-ai-service
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: sharecart-ai-service
      - key: APP_ENV
        value: prod
      - key: API_V1_PREFIX
        value: /api/v1
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_ALGORITHM
        value: HS256
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_TIMEOUT_SECONDS
        value: "25"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MAX_IMAGE_DIMENSION
        value: "2200"
      - key: RATE_LIMIT_HOURLY
        value: "10"
      - key: RATE_LIMIT_DAILY
        value: "50"
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
